<form id="checkin-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="user/user/checkin">

    <div class="form-group">
        <label for="c-username" class="control-label col-xs-12 col-sm-3">{:__('Username_mobile')}:</label>
        <div class="col-xs-12 col-sm-5">
            <input id="c-username" data-rule="required" class="form-control" name="row[username]" type="text">
        </div>
    </div>

<!--    <div class="form-group">-->
<!--        <label for="c-checkintime" class="control-label col-xs-12 col-sm-3">{:__('CheckInTime')}:</label>-->
<!--        <div class="col-xs-12 col-sm-4">-->
<!--            <input id="c-checkintime" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" name="row[checkintime]" type="text">-->
<!--        </div>-->
<!--    </div>-->

    <div class="form-group">
        <label for="c-daterange" class="control-label col-xs-12 col-sm-3">{:__('CheckInDaterange')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-daterange" data-rule="required" name="row[daterange]" type="text" class="form-control datetimerange" data-locale='{"format":"YYYY-MM-DD"}' placeholder="指定日期" />
        </div>
    </div>

    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
